[workspace]
resolver = "3"
members = ["crates/lapi", "crates/alibivms"]

[workspace.package]
edition = "2024"
version = "0.1.2"
license = "Elastic-2.0"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
md5 = "0.7"
rand = "0.9"
