[package]
name = "alibivms"
description = "Desktop viewer, playback and clip download for Alibi NVRs"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
lapi = { path = "../lapi" }
anyhow.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
rand.workspace = true
md5.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1"
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "2", default-features = false }
time = { version = "0.3", features = ["formatting", "macros", "local-offset"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }
gst = { package = "gstreamer", version = "0.25" }
gst-video = { package = "gstreamer-video", version = "0.25" }
gstgtk4 = { package = "gst-plugin-gtk4", version = "0.15", features = ["gtk_v4_14"] }
tokio-util = "0.7"
dirs = "6"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
url = "2.5.8"
